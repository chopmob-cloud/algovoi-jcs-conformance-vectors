# Manifest integrity: the manifest must keep describing the bytes on disk.
#
# Fast, dependency-free gate (Python stdlib only). Fails the build if:
#   - package.json and manifest.json versions disagree,
#   - any anchor-set sha256 no longer matches its primary_file,
#   - the recorded anchor-set / vector totals drift from what is on disk.
#
# See tools/check_manifest_integrity.py for the exact checks.

name: manifest integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: manifest describes the bytes on disk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check manifest integrity
        run: python tools/check_manifest_integrity.py
