# 10-way JCS consensus: continuously enforce the differential adversarial substrate.
#
# Rebuilds all ten independent canon probes from source on a clean checkout and
# runs the N-way consensus driver with REQUIRE=10. The job fails unless every
# agree/reject case reaches full ten-implementation consensus, every relational
# invariant holds, and every fail-closed integrity gate passes. This turns the
# point-in-time VM2 attestation (_attestations/…) into an invariant proven on
# every push.
#
# Ten languages / ten distinct JCS libraries:
#   python/rfc8785 · node/canonicalize · go/gowebpki-jcs · php inline ·
#   ruby/json-canonicalization · java+kotlin/erdtman · rust/serde_jcs ·
#   dotnet/Baqhub · elixir/jcs
#
# Note: the java/kotlin jars (erdtman + jackson) are intentionally gitignored, so
# a clean checkout has none, so the "Fetch Java/Kotlin jars" step pulls them from
# Maven Central at pinned versions before the run.

name: 10-way JCS consensus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consensus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consensus:
    name: differential adversarial substrate (REQUIRE=10)
    runs-on: ubuntu-latest
    env:
      SUBSTRATE_DIR: composition/differential_adversarial
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # gowebpki/jcs and serde_jcs/Baqhub/jcs (hex) are fetched by the toolchains
      # at build time; consensus is computed over the rebuilt-from-source probes.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # --- ten toolchains ---
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet rfc8785

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund --loglevel=error

      - name: Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # honours the `go 1.26.1` directive in the probe module; setup-go
          # installs the latest matching release.
          go-version-file: composition/differential_adversarial/go/go.mod

      - name: Java (Temurin 17)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"

      - name: Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.2"
      - run: gem install --no-document json-canonicalization

      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Elixir / OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Kotlin compiler
        run: |
          set -euo pipefail
          KV=2.0.20
          KOTLIN_SHA256=5f5d2a8ad6a718a002acd0775b67a9e27035872fdbd4b0791e3cb3ea00095931
          curl -fsSL -o /tmp/kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KV}/kotlin-compiler-${KV}.zip"
          echo "${KOTLIN_SHA256}  /tmp/kotlin.zip" | sha256sum -c -
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      # --- fetch the gitignored java/kotlin jars from Maven Central (pinned) ---
      - name: Fetch Java/Kotlin jars
        run: |
          set -euo pipefail
          LIB="$SUBSTRATE_DIR/java/libs"
          mkdir -p "$LIB"
          B=https://repo1.maven.org/maven2
          fetch() {
            local path="$1" sha="$2"
            curl -fsSL "$B/$path" -o "$LIB/$(basename "$path")"
            echo "${sha}  $LIB/$(basename "$path")" | sha256sum -c -
          }
          fetch io/github/erdtman/java-json-canonicalization/1.1/java-json-canonicalization-1.1.jar \
            ed12a01f28d147898312963a1f704e90290b67a61f34fa3a761f41c134f4e691
          fetch com/fasterxml/jackson/core/jackson-core/2.17.0/jackson-core-2.17.0.jar \
            55be130f6a68038088a261856c4e383ce79957a0fc1a29ecb213a9efd6ef4389
          fetch com/fasterxml/jackson/core/jackson-databind/2.17.0/jackson-databind-2.17.0.jar \
            d0ed5b54cb1b0bbb0828e24ce752a43a006dc188b34e3a4ae3238acc7b637418
          fetch com/fasterxml/jackson/core/jackson-annotations/2.17.0/jackson-annotations-2.17.0.jar \
            8562569a001d46e84ea23802257e33c8f68b24eb47c1e0efd133a0372c512959
          ls -l "$LIB"

      # --- the invariant: full ten-way consensus or the job fails ---
      - name: Run differential adversarial substrate
        working-directory: composition/differential_adversarial
        env:
          REQUIRE: "10"
          GOTOOLCHAIN: local
        run: bash run_differential.sh
